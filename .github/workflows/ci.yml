name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shop
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop -d shop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://shop:shop@127.0.0.1:5432/shop

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (Python from .python-version)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Install GNU gettext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext

      - name: Compile translations
        run: uv run python manage.py compilemessages --ignore=.venv

      - name: Build CSS (Tailwind standalone CLI)
        run: uv run python scripts/tailwind.py build

      - name: Django system checks
        run: uv run python manage.py check --fail-level WARNING

      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Tests
        run: uv run pytest

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build --target runtime --tag jewelry-shop:ci .
