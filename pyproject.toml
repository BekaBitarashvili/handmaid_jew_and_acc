[project]
name = "handmade-jewelry-store"
version = "0.1.0"
description = "Bilingual online boutique for handmade jewelry and accessories"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<6.0",
    "django-environ>=0.14.0",
    "django-htmx>=1.29.0",
    "django-modeltranslation>=0.20.6",
    "django-storages[s3]>=1.14.6",
    "django-unfold>=0.110.1",
    "gunicorn>=27.0.1",
    "huey>=3.5.4",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.2",
    "redis>=8.2.0",
    "sentry-sdk>=3.0.0",
    "whitenoise>=6.12.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/*.py", "docs/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "DJ",  # flake8-django
    "SIM", # simplify
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
python_files = ["test_*.py", "tests.py"]
addopts = "--strict-markers"

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "factory-boy>=3.3.3",
    "fonttools[woff]>=4.68.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.6",
]
